[project]
name = "git-markdown-autotranslator"
version = "0.1.0"
description = "Automatic translation of your *.md files, simply fast and convenient"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deep-translator>=1.11.4",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
dev = [
    "deep-translator>=1.11.4",
    "ipykernel>=7.3.0",
    "markdown-it-py>=4.2.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
